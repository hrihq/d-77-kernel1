name: Build D-77 Kernel1

on:
  push:
    branches: [ d-77 ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Select Build Type'
        required: true
        default: 'MIUI-OOS'
        type: choice
        options:
          - MIUI-OOS
          - AOSP

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        ref: d-77
        fetch-depth: 1

    - name: Prepare timezone
      run: sudo ln -sf /usr/share/zoneinfo/Asia/Jakarta /etc/localtime

    - name: Install Dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y \
          bc cpio flex bison git python-is-python3 tar perl wget curl \
          aria2 lz4 libssl-dev libelf-dev libyaml-dev dwarves zip zstd \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi build-essential

    - name: Setup Environment
      run: |
        echo "BUILD_TIME=$(TZ=Asia/Jakarta date '+%d%m%Y-%H%M')" >> "$GITHUB_ENV"
        echo "BUILD_DATE=\"$(TZ=Asia/Jakarta date '+%b %d %Y')\"" >> "$GITHUB_ENV"

    - name: Setup Compiler
      shell: bash
      run: |
        set -e
        mkdir -p clang

        CLANG_TARBALL_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android13-release/clang-r450784d.tar.gz"

        echo "Downloading AOSP clang r450784d (Android 13) from googlesource"
        # retry loop: googlesource archives can truncate; verify with tar before accepting
        ok=0
        for attempt in 1 2 3 4 5; do
          echo "attempt $attempt"
          curl -fL --retry 3 --retry-delay 5 -C - -o clang.tar.gz "$CLANG_TARBALL_URL"
          if tar tzf clang.tar.gz >/dev/null 2>&1; then
            ok=1
            echo "archive OK"
            break
          fi
          echo "archive corrupt, retrying"
          rm -f clang.tar.gz
          sleep $((attempt * 5))
        done
        if [ "$ok" -ne 1 ]; then
          echo "FAILED to download a valid clang archive"
          exit 1
        fi

        tar -C clang -xzf clang.tar.gz
        rm -f clang.tar.gz

        echo "CLANG_PATH=$GITHUB_WORKSPACE/clang" >> "$GITHUB_ENV"
        echo
        echo "Compiler:"
        "$GITHUB_WORKSPACE/clang/bin/clang" --version | head -n 1
        "$GITHUB_WORKSPACE/clang/bin/ld.lld" --version | head -n 1

    - name: Patch Panel Dimensions
      shell: bash
      run: |
        set -e
        apply_panel_dimensions() {
            local w="$1"
            local h="$2"
            local files=(
                "arch/arm64/boot/dts/qcom/xiaomi/sweet/dsi-panel-k6-38-0e-0b-fhd-dsc-video.dtsi"
                "arch/arm64/boot/dts/qcom/xiaomi/sweet/dsi-panel-k6-38-0c-0a-fhd-dsc-video.dtsi"
            )
            for f in "${files[@]}"; do
                if [[ -f "$f" ]]; then
                    echo "Patching $f -> ${w}x${h}"
                    sed -i "s/\(qcom,mdss-pan-physical-width-dimension[[:space:]]*=[[:space:]]*< *\)[0-9]\+/\1${w}/" "$f"
                    sed -i "s/\(qcom,mdss-pan-physical-height-dimension[[:space:]]*=[[:space:]]*< *\)[0-9]\+/\1${h}/" "$f"
                else
                    echo "WARN: $f not found"
                fi
            done
        }
        if [[ "${{ github.event.inputs.build_type || 'MIUI-OOS' }}" == "AOSP" ]]; then
            apply_panel_dimensions 69 156
        else
            apply_panel_dimensions 695 1546
        fi

    - name: Build Kernel
      shell: bash
      run: |
        set -e
        export ARCH=arm64
        export SUBARCH=arm64
        export KBUILD_BUILD_USER=hrihq
        export KBUILD_BUILD_HOST=D-77
        export PATH="$CLANG_PATH/bin:$PATH"
        export CC=clang
        export LD=ld.lld
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
        export KBUILD_COMPILER_STRING="$(clang --version | head -n1)"

        echo "========================================="
        echo "       D-77 Kernel1 Compilation"
        echo "========================================="
        echo "Build type : ${{ github.event.inputs.build_type || 'MIUI-OOS' }}"
        echo "Compiler   : AOSP clang r450784d (googlesource)"
        echo "Date       : $BUILD_DATE"
        echo "Jobs       : $(nproc --all)"
        echo "========================================="

        make O=out ARCH=arm64 vendor/sweet_user_defconfig

        make -j"$(nproc --all)" O=out ARCH=arm64 2>&1 | tee build.log

        cp out/.config out/defconfig.txt

    - name: Verify Kernel Build
      shell: bash
      run: |
        set -e
        KERNEL="out/arch/arm64/boot/Image.gz-dtb"
        failed=0
        if [[ ! -f "$KERNEL" ]]; then
          echo "Missing: $KERNEL"
          failed=1
        else
          echo "Found: $KERNEL"
          ls -lh "$KERNEL"
        fi
        for extra in out/arch/arm64/boot/dtbo.img out/arch/arm64/boot/dtb.img; do
          [[ -f "$extra" ]] && echo "Found: $extra" && ls -lh "$extra"
        done
        if [[ "$failed" -ne 0 ]]; then
          echo "Kernel compilation failed."
          exit 1
        fi

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log-${{ env.BUILD_TIME }}
        path: |
          build.log
          out/defconfig.txt
        if-no-files-found: ignore

    - name: Clone AnyKernel3 & Zip
      shell: bash
      run: |
        set -e
        git clone --depth=1 https://github.com/hrihq/anykernel3.git AnyKernel3
        cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/Image.gz-dtb
        for extra in dtbo.img dtb.img; do
          [[ -f "out/arch/arm64/boot/$extra" ]] && cp "out/arch/arm64/boot/$extra" "AnyKernel3/$extra"
        done
        cd AnyKernel3
        zip -r9 "../D-77-kernel1-${{ env.BUILD_TIME }}.zip" . -x ".git/*"

    - name: Upload Flashable Zip
      uses: actions/upload-artifact@v4
      with:
        name: D-77-kernel1-${{ env.BUILD_TIME }}
        path: D-77-kernel1-${{ env.BUILD_TIME }}.zip

    - name: Publish Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG="D-77-kernel1-$(TZ=Asia/Jakarta date '+%Y%m%d-%H%M%S')"
        {
          echo "## D-77 Kernel1 - Redmi Note 12 Pro 4G (sweet_k6a)"
          echo ""
          echo "- Build type: ${{ github.event.inputs.build_type || 'MIUI-OOS' }}"
          echo "- Compiler: AOSP clang r450784d (googlesource)"
          echo "- Kernel: 4.14.336-D77-kernel1"
          echo "- KernelSU-Next v3.4.0 (syscall table hook, 4.14-compat)"
          echo "- fake uname 6.12.13 (netbpfload / Android 16 BPF)"
          echo "- Build date: ${BUILD_DATE}"
          echo ""
          echo "Device: sweet / sweet_k6a / sweet2"
          echo ""
          echo "### Credits"
          echo "- Base kernel: Pulkit077/kernel_xiaomi_sweet_k6a"
          echo "- KernelSU-Next: KernelSU-Next Team"
          echo "- Maintainer: @hrihq"
        } > /tmp/notes.md
        gh release create "$TAG" "D-77-kernel1-${{ env.BUILD_TIME }}.zip" \
          --repo hrihq/d-77-kernel1 \
          --title "D-77 Kernel1 ${BUILD_DATE}" \
          --notes-file /tmp/notes.md
